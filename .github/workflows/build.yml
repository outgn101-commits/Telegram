name: Ultimate Telegram Mod
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true

      # 🚨 暴力硬改官方纯血源码：防撤回 + 幽灵模式
      - name: Force Patch (Anti-Recall & Ghost)
        run: |
          echo "开始注入防撤回..."
          sed -i '/private void processDeletedMessages/,/)/ s/{/{ if (true) return; /' TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java
          
          echo "开始注入幽灵模式(防已读)..."
          sed -i '/public void sendReadMessages/,/)/ s/{/{ if (true) return; /' TMessagesProj/src/main/java/org/telegram/messenger/SendMessagesHelper.java
          
          echo "开始注入幽灵模式(防正在输入)..."
          sed -i '/public void sendTyping/,/)/ s/{/{ if (true) return; /' TMessagesProj/src/main/java/org/telegram/messenger/SendMessagesHelper.java
          
          echo "补丁注入完成！"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew TMessagesProj_App:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Modded-Telegram
          path: "**/*.apk"
