name: Build Local Cache Telegram
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true

      # 🚨 纯正本地缓存注入：不拦服务器，只偷偷存本地文件
      - name: Inject True Local File Cache
        run: |
          python3 - <<'EOF'
          import os
          import re

          # 目标：纸飞机底层的数据库操作类
          file_path = "TMessagesProj/src/main/java/org/telegram/messenger/MessagesStorage.java"
          if not os.path.exists(file_path):
              print("找不到文件")
              exit(1)

          with open(file_path, "r", encoding="utf-8") as f:
              content = f.read()

          # 找到真正执行删除消息的方法 markMessagesDeleted
          pattern = r"(public void markMessagesDeleted\(long dialog_id, long merge_id, ArrayList<Integer> ids, int type\)\s*\{)"
          
          # 注入代码：在执行原本删除逻辑之前，把消息内容写进 JSON 文件
          inject_code = r"""\1
              // 🚨 强行本地缓存开始
              try {
                  java.io.File cacheFile = new java.io.File(org.telegram.messenger.ApplicationLoader.applicationContext.getFilesDir(), "anti_recall_cache.txt");
                  java.io.FileWriter fw = new java.io.FileWriter(cacheFile, true);
                  for (Integer id : ids) {
                      // 注意：这里简化了查询逻辑，实际源码里需要查数据库拿原文
                      fw.write("被撤回的消息ID: " + id + " 时间: " + System.currentTimeMillis() + "\n");
                  }
                  fw.close();
              } catch (Exception e) {}
              // 🚨 强行本地缓存结束
          """
          
          new_content, count = re.subn(pattern, inject_code, content, count=1)
          
          if count > 0:
              with open(file_path, "w", encoding="utf-8") as f:
                  f.write(new_content)
              print("✅ 本地缓存文件写入逻辑已成功强行注入！")
          else:
              print("⚠️ 匹配失败，官方代码结构变了。")
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew TMessagesProj_App:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalCache-Telegram
          path: "**/*.apk"
