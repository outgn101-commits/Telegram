name: Auto Inject Local Cache
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true

      # 🚨 终极自动修改：不匹配正则，直接强行插入！
      - name: Auto Patch Local Cache
        run: |
          python3 - <<'EOF'
          import os

          # 1. 修改网络层控制器
          file_mc = "TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java"
          if os.path.exists(file_mc):
              with open(file_mc, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              injected = False
              for i, line in enumerate(lines):
                  # 只要看到处理删除的逻辑，并且还没注入过
                  if "processDeletedMessages" in line and "{" in line and not injected:
                      # 强行在下一行插入本地缓存代码
                      lines.insert(i + 1, """
                          try {
                              java.io.File cacheFile = new java.io.File(ApplicationLoader.applicationContext.getFilesDir(), "secret_cache.txt");
                              java.io.FileWriter fw = new java.io.FileWriter(cacheFile, true);
                              fw.write("发现撤回动作，时间: " + System.currentTimeMillis() + "\\n");
                              fw.close();
                          } catch (Exception e) {}
                      """)
                      injected = True
                      break
              
              if injected:
                  with open(file_mc, "w", encoding="utf-8") as f:
                      f.writelines(lines)
                  print("✅ 成功自动注入网络层缓存！")
              else:
                  print("⚠️ 网络层找不到对应方法。")

          # 2. 修改底层数据库层
          file_ms = "TMessagesProj/src/main/java/org/telegram/messenger/MessagesStorage.java"
          if os.path.exists(file_ms):
              with open(file_ms, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              injected_ms = False
              for i, line in enumerate(lines):
                  if "markMessagesDeleted" in line and "{" in line and not injected_ms:
                      lines.insert(i + 1, """
                          try {
                              java.io.File cacheFile = new java.io.File(ApplicationLoader.applicationContext.getFilesDir(), "secret_cache.txt");
                              java.io.FileWriter fw = new java.io.FileWriter(cacheFile, true);
                              fw.write("数据库收到删除指令，拦截保存！\\n");
                              fw.close();
                          } catch (Exception e) {}
                      """)
                      injected_ms = True
                      break
              
              if injected_ms:
                  with open(file_ms, "w", encoding="utf-8") as f:
                      f.writelines(lines)
                  print("✅ 成功自动注入数据库层缓存！")
              else:
                  print("⚠️ 数据库层找不到对应方法。")
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew TMessagesProj_App:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoCache-Telegram
          path: "**/*.apk"
