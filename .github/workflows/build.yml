name: Auto Inject Database Local Cache
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true

      # 🚨 暴击底层：只改数据库层，强行本地缓存！
      - name: Auto Patch Database Local Cache
        run: |
          python3 - <<'EOF'
          import os

          # 只针对底层数据库操作文件
          file_ms = "TMessagesProj/src/main/java/org/telegram/messenger/MessagesStorage.java"
          
          if not os.path.exists(file_ms):
              print("❌ 找不到 MessagesStorage.java 文件！")
              exit(1)

          with open(file_ms, "r", encoding="utf-8") as f:
              lines = f.readlines()

          injected = False
          
          # 逐行扫描，找数据库删除指令
          for i, line in enumerate(lines):
              # 只要找到这个方法名，不管后面参数多长，只要有大括号就算
              if "markMessagesDeleted" in line and "{" in line and not injected:
                  # 强行在下一行插入本地缓存代码
                  lines.insert(i + 1, """
                      // 🚨 强行注入本地数据库缓存！
                      try {
                          java.io.File cacheFile = new java.io.File(ApplicationLoader.applicationContext.getFilesDir(), "local_deleted_cache.txt");
                          java.io.FileWriter fw = new java.io.FileWriter(cacheFile, true);
                          fw.write("本地数据即将删除，已拦截！时间: " + System.currentTimeMillis() + "\\n");
                          fw.close();
                      } catch (Exception e) {}
                  """)
                  injected = True
                  print("✅ 成功在本地数据库层自动注入缓存代码！")
                  break

          if not injected:
              print("⚠️ 警告：没有找到 markMessagesDeleted 方法，官方可能改名了。")

          if injected:
              with open(file_ms, "w", encoding="utf-8") as f:
                  f.writelines(lines)
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew TMessagesProj_App:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DatabaseCache-Telegram
          path: "**/*.apk"
